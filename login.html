<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | EstateHub – Premium Real Estate Agency & Property Portal</title>
     <link rel="icon" type="image/png" href="assets/fav.png">
    <meta name="description"
        content="Log in to your EstateHub account — manage your listings, track saved properties, connect with agents, and handle all your real estate needs.">

    <!-- Tailwind CSS + Fonts -->
       <script src="tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        heading: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0F1F3D;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 0;
            padding: 80px 16px 40px 16px;
            box-sizing: border-box;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* Luxury modern home background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2070&auto=format');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.30;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(15, 31, 61, 0.94) 0%, rgba(30, 58, 95, 0.86) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            margin: auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 32px 32px;
            text-align: center;
            box-shadow: 0 35px 60px -15px rgba(15, 31, 61, 0.55);
            border: 1px solid rgba(201, 169, 97, 0.35);
            transition: all 0.3s ease;
            width: 100%;
        }

        /* Dark mode card */
        .dark .login-card {
            background: rgba(19, 35, 57, 0.97);
            border-color: rgba(201, 169, 97, 0.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .logo a {
            text-decoration: none;
        }

        .logo-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0F1F3D, #1E3A5F);
            border: 1px solid rgba(201, 169, 97, 0.45);
            box-shadow: 0 8px 18px -6px rgba(15, 31, 61, 0.5);
            transition: transform 0.3s ease;
        }

        .logo a:hover .logo-badge {
            transform: translateY(-2px) scale(1.04);
        }

        .logo-text {
            font-family: 'Playfair Display', Georgia, serif;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .logo-text .gold {
            color: #C9A961;
        }

        .title {
            text-align: center;
            margin-bottom: 24px;
        }

        .title h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 30px;
            font-weight: 800;
            color: #0F1F3D;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .dark .title h1 { color: #F5EFE4; }

        .title h1 .gold-italic {
            background: linear-gradient(135deg, #C9A961 0%, #E0C28A 50%, #C9A961 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-style: italic;
            font-weight: 600;
        }

        .title p {
            font-size: 13px;
            color: #78716C;
        }

        .dark .title p { color: #A8A29E; }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #78716C;
            margin-bottom: 6px;
        }

        .dark .form-group label { color: #A8A29E; }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E8E2D6;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            color: #0F1F3D;
            background: #FAF7F2;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .dark .form-group input {
            color: #F5EFE4;
            border-color: #1E3A5F;
            background: rgba(255, 255, 255, 0.04);
        }

        .form-group input::placeholder {
            color: #A8A29E;
            font-weight: 400;
        }

        .form-group input:focus {
            outline: none;
            border-color: #C9A961;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.18);
        }

        .dark .form-group input:focus {
            background: rgba(255, 255, 255, 0.06);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #A8A29E;
            cursor: pointer;
            font-size: 13px;
            padding: 6px;
            transition: color 0.2s;
        }

        .toggle-password:hover { color: #C9A961; }

        .forgot-link {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .forgot-link a {
            font-size: 11px;
            color: #C9A961;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link a:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            border: none;
            border-radius: 40px;
            color: #0F1F3D;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-bottom: 10px;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            transition: background 0.25s, transform 0.08s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            transition: left 0.6s ease;
        }

        .btn-login:hover::before { left: 100%; }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(201, 169, 97, 0.6);
        }

        .btn-login:active { transform: scale(0.98) translateY(0); }

        .divider {
            text-align: center;
            margin: 20px 0 20px;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #E8E2D6;
        }

        .dark .divider::before { background: #1E3A5F; }

        .divider span {
            position: relative;
            background: #ffffff;
            padding: 0 12px;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: #A8A29E;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .dark .divider span { background: #132339; color: #A8A29E; }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            flex: 1;
            height: 44px;
            border-radius: 40px;
            border: 1px solid #E8E2D6;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #0F1F3D;
            transition: all 0.2s;
        }

        .dark .social-btn {
            background: rgba(255, 255, 255, 0.04);
            border-color: #1E3A5F;
            color: #F5EFE4;
        }

        .social-btn:hover {
            border-color: #C9A961;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -8px rgba(201, 169, 97, 0.45);
        }

        .social-btn i { font-size: 14px; }
        .social-btn.google i { color: #DB4437; }
        .social-btn.facebook i { color: #1877F2; }
        .social-btn.apple i { color: #0F1F3D; }
        .dark .social-btn.apple i { color: #F5EFE4; }

        .signup-link {
            text-align: center;
            font-size: 12px;
            color: #78716C;
            padding-top: 10px;
            border-top: 1px solid #E8E2D6;
        }

        .dark .signup-link {
            border-top-color: #1E3A5F;
            color: #A8A29E;
        }

        .signup-link a {
            color: #C9A961;
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
        }

        .signup-link a:hover { text-decoration: underline; }

        .demo-badge {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            color: #A8A29E;
        }

        .dark .demo-badge { color: #78716C; }

        .top-controls {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            gap: 10px;
            z-index: 200;
        }

        .control-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(15, 31, 61, 0.72);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 169, 97, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #E0C28A;
            font-size: 16px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(15, 31, 61, 0.25);
        }

        .control-btn:hover {
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            border-color: transparent;
            transform: scale(1.05);
            color: #0F1F3D;
        }

        .dark .control-btn {
            background: rgba(0, 0, 0, 0.65);
            border-color: rgba(201, 169, 97, 0.7);
            color: #E0C28A;
        }
        .dark .control-btn:hover {
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            color: #0F1F3D;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            color: #0F1F3D;
            padding: 11px 24px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 700;
            z-index: 300;
            animation: toastFade 2.5s ease forwards;
            white-space: nowrap;
            box-shadow: 0 10px 26px rgba(15, 31, 61, 0.35);
            pointer-events: none;
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            12% { opacity: 1; transform: translateX(-50%) translateY(0); }
            88% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-6px); visibility: hidden; }
        }

        /* RTL Support */
        [dir="rtl"] .top-controls { right: auto; left: 18px; }
        [dir="rtl"] .password-wrapper input { padding-right: 14px; padding-left: 44px; }
        [dir="rtl"] .toggle-password { right: auto; left: 12px; }
        [dir="rtl"] .forgot-link { text-align: left; }
        [dir="rtl"] .signup-link a { margin-left: 0; margin-right: 5px; }
        [dir="rtl"] .social-login { flex-direction: row-reverse; }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .login-card { padding: 24px 24px; }
            .title h1 { font-size: 24px; }
            .social-btn { height: 40px; font-size: 11px; }
            .btn-login { padding: 10px; }
            .top-controls { top: 12px; right: 12px; }
            .control-btn { width: 38px; height: 38px; font-size: 14px; }
            [dir="rtl"] .top-controls { right: auto; left: 12px; }
        }

        @media (max-height: 650px) {
            body { padding-top: 60px; padding-bottom: 20px; }
            .login-card { padding: 16px 20px; border-radius: 24px; }
            .title { margin-bottom: 12px; }
            .title h1 { font-size: 20px; margin-bottom: 2px; }
            .title p { font-size: 10px; }
            .form-group { margin-bottom: 8px; }
            .form-group label { font-size: 9px; margin-bottom: 3px; }
            .form-group input { padding: 7px 10px; font-size: 11px; border-radius: 10px; }
            .social-login { margin-bottom: 12px; gap: 8px; }
            .social-btn { height: 34px; font-size: 10px; }
            .btn-login { margin-bottom: 8px; padding: 8px; font-size: 10px; }
            .logo { margin-bottom: 10px; }
            .divider { margin: 10px 0; }
            .signup-link { padding-top: 10px; font-size: 10px; }
            .demo-badge { margin-top: 10px; font-size: 9px; }
            .forgot-link { margin-bottom: 12px; }
            .forgot-link a { font-size: 9px; }
        }

        @media (max-width: 360px) {
            .social-btn span { display: none; }
            .social-btn { width: 44px; flex: none; }
            .social-btn i { font-size: 18px; margin: 0; }
        }
    </style>
</head>

<body>

    <div class="top-controls">
        <button class="control-btn" id="themeToggle" title="Toggle Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
        <button class="control-btn" id="rtlToggle" title="Toggle RTL Layout"><i class="fas fa-exchange-alt"></i></button>
    </div>

    <div class="login-container dark">
        <div class="login-card animate-fade-up">
            <div class="logo flex justify-center mb-6">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="logo-badge">
                        <i class="fas fa-building text-[#C9A961] text-lg"></i>
                    </div>
                    <div class="flex flex-col leading-none text-left">
                        <span class="font-display text-2xl font-bold text-white">Estate<span style="color:#C9A961;">Hub</span></span>
                        <span class="text-[8px] tracking-[0.28em] uppercase font-semibold text-white/60">Real Estate • Property Portal</span>
                    </div>
                </a>
            </div>
            <div class="title">
                <h1>Welcome <span class="gold-italic">Back</span></h1>
                <p>Log in to your property dashboard</p>
            </div>

            <div class="social-login">
                <button class="social-btn google" id="googleLogin"><i class="fab fa-google"></i><span>Google</span></button>
                <button class="social-btn facebook" id="facebookLogin"><i class="fab fa-facebook-f"></i><span>Facebook</span></button>
                <button class="social-btn apple" id="appleLogin"><i class="fab fa-apple"></i><span>Apple</span></button>
            </div>

            <div class="divider"><span>Or continue with email</span></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="hello@estatehub.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="password"><i class="fas fa-eye-slash"></i></button>
                    </div>
                </div>
                <div class="forgot-link"><a href="#">Forgot password?</a></div>
                <button type="submit" class="btn-login">Log In</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
            <div class="demo-badge">
                <i class="fas fa-home"></i> Demo: demo@estatehub.com / any password
            </div>
        </div>
    </div>

    <script>
        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast && toast.parentNode) toast.remove(); }, 2600);
        }

        // Password visibility toggle
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const input = document.getElementById(btn.getAttribute('data-target'));
                const icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye-slash';
                }
            });
        });

        // Dark Mode
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        function updateThemeIcon() {
            if (html.classList.contains('dark')) {
                themeIcon.className = 'fas fa-sun';
            } else {
                themeIcon.className = 'fas fa-moon';
            }
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
                updateThemeIcon();
            });
        }

        if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');
        updateThemeIcon();

        // RTL Toggle
        const rtlToggle = document.getElementById('rtlToggle');
        if (rtlToggle) {
            rtlToggle.addEventListener('click', () => {
                if (document.documentElement.getAttribute('dir') === 'rtl') {
                    document.documentElement.removeAttribute('dir');
                    localStorage.setItem('dir', 'ltr');
                    
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                    localStorage.setItem('dir', 'rtl');
                    
                }
            });
        }
        if (localStorage.getItem('dir') === 'rtl') document.documentElement.setAttribute('dir', 'rtl');

        // Social login handlers
        const socialHandlers = { google: 'Google', facebook: 'Facebook', apple: 'Apple' };
        Object.keys(socialHandlers).forEach(provider => {
            const btn = document.getElementById(`${provider}Login`);
            if (btn) {
                btn.addEventListener('click', () => showToast(` ${socialHandlers[provider]} login — coming soon`));
            }
        });

        // Form submission
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                if (!email) return showToast(' Please enter your email address');
                if (!password) return showToast(' Please enter your password');
                if (email === 'demo@estatehub.com' || email === 'hello@estatehub.com') {
                    showToast(` Welcome back! Redirecting to your dashboard...`);
                    setTimeout(() => { window.location.href = 'customer-dashboard.html'; }, 1500);
                } else {
                    showToast(` Logged in successfully! Redirecting...`);
                    setTimeout(() => { window.location.href = 'customer-dashboard.html'; }, 1500);
                }
            });
        }

    </script>
</body>

</html>
