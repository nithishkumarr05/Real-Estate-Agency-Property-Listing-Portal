<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>EstateHub | 404 — Property Not Found</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <meta name="description"
    content="Page not found — The property you're looking for has been sold or moved. Return to EstateHub for premium real estate listings and trusted agents.">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* Static, fully responsive 404 page — no animations, matches EstateHub brand */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0F1F3D;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    /* Background: perfectly static, responsive cover */
    .background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .background-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
    }

    /* Static gradient overlays — EstateHub navy */
    .overlay-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(15, 31, 61, 0.92) 0%, rgba(15, 31, 61, 0.80) 50%, rgba(30, 58, 95, 0.90) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .overlay-gradient-bottom {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(15, 31, 61, 0.65) 0%, transparent 60%);
      z-index: 1;
      pointer-events: none;
    }

    /* MAIN CONTENT CONTAINER — absolute centering, responsive */
    .fixed-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      overflow: hidden;
      padding: clamp(12px, 4vw, 32px);
      pointer-events: auto;
    }

    .content-wrapper {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: clamp(0.75rem, 4vw, 1.8rem);
      background: transparent;
      overflow: visible;
    }

    /* 404 Number - responsive, EstateHub gold */
    .four-zero-four {
      position: relative;
      margin-bottom: clamp(0.5rem, 3vw, 1.25rem);
      text-align: center;
    }

    .glow-text {
      color: #C9A961;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: clamp(65px, 14vw, 160px);
      line-height: 1;
      text-shadow: 0 0 12px rgba(201, 169, 97, 0.35);
      display: inline-block;
      position: relative;
      z-index: 10;
      font-style: italic;
    }

    /* Decorative lines — static, gold */
    .decor-left,
    .decor-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 1.2vw, 8px);
      pointer-events: none;
    }

    .decor-left {
      left: clamp(-28px, -6vw, -15px);
    }

    .decor-right {
      right: clamp(-28px, -6vw, -15px);
    }

    @media (max-width: 640px) {
      .decor-left {
        left: clamp(-18px, -4vw, -10px);
      }

      .decor-right {
        right: clamp(-18px, -4vw, -10px);
      }

      .decor-line {
        width: 3px;
      }
    }

    .decor-line {
      width: clamp(2px, 0.7vw, 4px);
      height: clamp(6px, 2vw, 12px);
      background: #C9A961;
      border-radius: 3px;
    }

    .decor-line:nth-child(1),
    .decor-line:nth-child(5) {
      opacity: 0.25;
      height: clamp(5px, 1.6vw, 9px);
    }

    .decor-line:nth-child(2),
    .decor-line:nth-child(4) {
      opacity: 0.5;
    }

    .decor-line:nth-child(3) {
      opacity: 1;
      height: clamp(8px, 2.4vw, 15px);
    }

    /* Navigation cards — EstateHub style */
    .nav-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201, 169, 97, 0.2);
      transition: background-color 0.2s ease, border-color 0.2s ease;
      border-radius: clamp(0.6rem, 1.8vw, 0.9rem);
      padding: clamp(0.5rem, 1.8vw, 0.85rem);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(3px, 1.2vw, 6px);
    }

    .nav-card:hover {
      border-color: #C9A961;
      background-color: rgba(201, 169, 97, 0.12);
    }

    .nav-card i {
      font-size: clamp(1rem, 4vw, 1.5rem);
      color: #C9A961;
    }

    .nav-card span {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(7px, 2.5vw, 10px);
      color: #E5E0D5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    /* Button — EstateHub gold gradient with shine sweep */
    .btn-shine {
      background: linear-gradient(135deg, #C9A961, #E0C28A);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.4rem, 1.8vw, 0.65rem);
      text-decoration: none;
      border-radius: 9999px;
      padding: clamp(0.55rem, 2.2vw, 0.85rem) clamp(1rem, 3.5vw, 1.6rem);
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.6rem, 2.2vw, 0.8rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #0F1F3D;
      box-shadow: 0 12px 20px -12px rgba(201, 169, 97, 0.55);
      position: relative;
      overflow: hidden;
    }

    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transition: left 0.5s ease;
      pointer-events: none;
    }

    .btn-shine:hover::after {
      left: 100%;
    }

    .btn-shine:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px -10px rgba(201, 169, 97, 0.65);
    }

    .btn-shine i {
      font-size: clamp(0.6rem, 2.2vw, 0.8rem);
    }

    /* Text responsive */
    .message-title {
      font-size: clamp(1.2rem, 5vw, 2rem);
      font-weight: 700;
      color: white;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      font-family: 'Playfair Display', serif;
    }

    .message-title span {
      background: linear-gradient(135deg, #C9A961 0%, #E0C28A 50%, #C9A961 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-style: italic;
    }

    .message-text {
      font-size: clamp(0.7rem, 3vw, 0.95rem);
      color: #C8C2B8;
      line-height: 1.45;
      max-width: 460px;
      margin: 0 auto;
      font-weight: 300;
    }

    .help-text {
      font-size: clamp(0.65rem, 2.6vw, 0.8rem);
      color: #8B8478;
      margin-top: clamp(1.2rem, 5vw, 2rem);
    }

    .help-text a {
      color: #C9A961;
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 600;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    /* Grid responsive */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(0.65rem, 2.5vw, 1rem);
      max-width: 260px;
      width: 100%;
      margin: clamp(1.2rem, 5vw, 2rem) auto;
    }

    /* Ensure no scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 480px) {
      .nav-grid {
        max-width: 210px;
        gap: 0.65rem;
      }

      .btn-shine {
        white-space: normal;
        text-align: center;
        line-height: 1.3;
        padding: 0.5rem 1rem;
      }

      .content-wrapper {
        padding: 0.8rem;
      }
    }

    @media (min-width: 1280px) {
      .glow-text {
        font-size: 160px;
      }

      .decor-left {
        left: -38px;
      }

      .decor-right {
        right: -38px;
      }

      .content-wrapper {
        max-width: 880px;
      }
    }

    @media (max-width: 380px) {
      .glow-text {
        font-size: 55px;
      }

      .decor-left,
      .decor-right {
        gap: 3px;
      }

      .decor-left {
        left: -12px;
      }

      .decor-right {
        right: -12px;
      }

      .message-title {
        font-size: 1.1rem;
      }

      .message-text {
        font-size: 0.7rem;
      }
    }

    /* No movement anywhere — matches static requirement */
    .glow-text,
    .decor-line,
    .nav-card i,
    .btn-shine i {
      animation: none !important;
    }

    .nav-card:hover .nav-icon {
      transform: none !important;
    }

    .btn-shine:hover .arrow-icon,
    .btn-shine:hover .building-icon-btn {
      transform: none !important;
    }
  </style>
</head>

<body>

  <!-- Background Image Container — luxury real estate image -->
  <div class="background-container">
    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920&q=80"
      alt="Luxury property background"
      onerror="this.style.opacity='0'; this.parentElement.style.backgroundColor='#0F1F3D';">
  </div>

  <!-- Static Overlay Gradients -->
  <div class="overlay-gradient"></div>
  <div class="overlay-gradient-bottom"></div>

  <!-- Fixed Container - Content stays perfectly centered -->
  <div class="fixed-container">
    <div class="content-wrapper">
      <div class="text-center w-full">

        <!-- 404 Number with Decorative Lines -->
        <div class="four-zero-four">
          <div class="decor-left">
            <div class="decor-line"></div>
            <div class="decor-line"></div>
            <div class="decor-line"></div>
            <div class="decor-line"></div>
            <div class="decor-line"></div>
          </div>
          <div class="glow-text">404</div>
          <div class="decor-right">
            <div class="decor-line"></div>
            <div class="decor-line"></div>
            <div class="decor-line"></div>
            <div class="decor-line"></div>
            <div class="decor-line"></div>
          </div>
        </div>

        <!-- Message adapted for EstateHub -->
        <div>
          <h1 class="message-title">
            <span>Property Not Found</span>
          </h1>
          <p class="message-text">
            This page has been sold, relocated, or never existed.
            The listing or property you're looking for might have been moved or is no longer available.
          </p>
        </div>

        <!-- Quick Navigation Links - Home + Contact -->
        <div class="nav-grid">
          <a href="index.html" class="nav-card">
            <i class="fas fa-home"></i>
            <span>Home</span>
          </a>
          <a href="contact.html" class="nav-card">
            <i class="fas fa-envelope"></i>
            <span>Contact</span>
          </a>
        </div>

        <!-- Back to Home Button -->
        <div>
          <a href="index.html" class="btn-shine">
            <i class="fas fa-arrow-left"></i>
            <span>Back to EstateHub</span>
            <i class="fas fa-building"></i>
          </a>
        </div>

        <!-- Help Text -->
        <p class="help-text">
          Need assistance? <a href="contact.html">Contact our team</a> and we'll help you find the perfect property.
        </p>
      </div>
    </div>
  </div>

  <!-- Static script — locks page, no movement, no extra icons -->
  <script>
    (function () {
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      document.body.style.position = 'fixed';
      document.documentElement.style.position = 'fixed';
      document.body.style.top = '0';
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.bottom = '0';
      document.body.style.width = '100%';
      document.body.style.height = '100%';

      function preventAllMovement(e) {
        e.preventDefault();
        return false;
      }

      document.body.addEventListener('touchmove', preventAllMovement, { passive: false });

      window.addEventListener('wheel', function (e) {
        e.preventDefault();
        return false;
      }, { passive: false });

      window.addEventListener('keydown', function (e) {
        const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space', 'PageUp', 'PageDown', 'Home', 'End'];
        if (keys.includes(e.key) || e.key === 'Space' || e.key === ' ') {
          e.preventDefault();
          return false;
        }
      });

      function resetScroll() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }

      resetScroll();
      window.addEventListener('scroll', resetScroll);

      const allParents = [document.documentElement, document.body];
      allParents.forEach(el => {
        if (el) {
          el.style.position = 'fixed';
          el.style.top = '0';
          el.style.left = '0';
          el.style.right = '0';
          el.style.bottom = '0';
          el.style.width = '100%';
          el.style.height = '100%';
          el.style.overflow = 'hidden';
        }
      });

      // Ensure no stray animations
      const staticElements = document.querySelectorAll('.glow-text, .decor-line, .nav-card i, .btn-shine i');
      staticElements.forEach(el => {
        el.style.animation = 'none';
      });

      window.addEventListener('load', function () {
        resetScroll();
        if (window.innerWidth <= 480) {
          const messageText = document.querySelector('.message-text');
          if (messageText) messageText.style.lineHeight = '1.4';
        }
        const container = document.querySelector('.fixed-container');
        if (container) {
          container.style.overflow = 'visible';
        }
      });

      window.addEventListener('resize', function () {
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';
        resetScroll();
      });

      const metaViewport = document.querySelector('meta[name="viewport"]');
      if (metaViewport) {
        metaViewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover');
      }

      // Additional style to ensure no unexpected animations
      const style = document.createElement('style');
      style.textContent = `
        .glow-text, .decor-line, .nav-card i, .btn-shine i, .nav-card, .btn-shine {
          animation: none !important;
        }
        * {
          animation-delay: 0s !important;
          animation-duration: 0s !important;
        }
        .fixed-container, .content-wrapper {
          transform: translateZ(0);
          -webkit-transform: translateZ(0);
        }
      `;
      document.head.appendChild(style);
    })();
  </script>

  <noscript>
    <style>
      body {
        background: #0F1F3D;
      }

      .background-container img {
        opacity: 0;
      }

      .glow-text {
        font-size: 90px;
      }

      .message-text {
        font-size: 14px;
      }
    </style>
  </noscript>
</body>

</html>
