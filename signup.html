<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up | EstateHub – Premium Real Estate Agency & Property Portal</title>
     <link rel="icon" type="image/png" href="assets/fav.png">
    <meta name="description"
        content="Create your EstateHub account — buy, rent, sell, or list properties with trusted agents and verified listings across the country.">

    <!-- Tailwind CSS + Fonts -->
       <script src="tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        heading: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0F1F3D;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Luxury modern home background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2070&auto=format');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.30;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(15, 31, 61, 0.94) 0%, rgba(30, 58, 95, 0.86) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .signup-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* Card styling - FULLY RESPONSIVE */
        .signup-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: clamp(16px, 2vh, 26px) clamp(20px, 3vw, 36px);
            text-align: center;
            box-shadow: 0 35px 60px -15px rgba(15, 31, 61, 0.55);
            border: 1px solid rgba(201, 169, 97, 0.35);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 520px;
            max-height: 98vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Dark mode card */
        .dark .signup-card {
            background: rgba(19, 35, 57, 0.97);
            border-color: rgba(201, 169, 97, 0.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        /* Logo styling */
        .logo a {
            text-decoration: none;
        }

        .logo-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0F1F3D, #1E3A5F);
            border: 1px solid rgba(201, 169, 97, 0.45);
            box-shadow: 0 8px 18px -6px rgba(15, 31, 61, 0.5);
            transition: transform 0.3s ease;
        }

        .logo a:hover .logo-badge {
            transform: translateY(-2px) scale(1.04);
        }

        .logo-text {
            font-family: 'Playfair Display', Georgia, serif;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .logo-text .gold {
            color: #C9A961;
        }

        .title {
            text-align: center;
            margin-bottom: clamp(8px, 1.5vh, 16px);
        }

        .title h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 30px;
            font-weight: 800;
            color: #0F1F3D;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .dark .title h1 { color: #F5EFE4; }

        .title h1 .gold-italic {
            background: linear-gradient(135deg, #C9A961 0%, #E0C28A 50%, #C9A961 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-style: italic;
            font-weight: 600;
        }

        .title p {
            font-size: 12.5px;
            color: #78716C;
            line-height: 1.5;
        }

        .dark .title p { color: #A8A29E; }

        .form-group {
            margin-bottom: clamp(6px, 1vh, 12px);
            text-align: left;
        }

        .form-group label {
            display: block;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #78716C;
            margin-bottom: 6px;
        }

        .dark .form-group label { color: #A8A29E; }

        .form-group input {
            width: 100%;
            padding: clamp(8px, 1.2vh, 12px) 14px;
            border: 1px solid #E8E2D6;
            border-radius: 12px;
            font-size: clamp(11px, 2vw, 13px);
            font-weight: 500;
            color: #0F1F3D;
            background: #FAF7F2;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .dark .form-group input {
            color: #F5EFE4;
            border-color: #1E3A5F;
            background: rgba(255, 255, 255, 0.04);
        }

        .form-group input::placeholder {
            color: #A8A29E;
            font-weight: 400;
            font-size: clamp(10px, 2vw, 12px);
        }

        .form-group input:focus {
            outline: none;
            border-color: #C9A961;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.18);
        }

        .dark .form-group input:focus {
            background: rgba(255, 255, 255, 0.06);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #A8A29E;
            cursor: pointer;
            font-size: 13px;
            padding: 6px;
            transition: color 0.2s;
        }

        .toggle-password:hover { color: #C9A961; }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: clamp(4px, 1vh, 10px) 0;
        }

        .checkbox-group input {
            width: 15px;
            height: 15px;
            margin-top: 1px;
            cursor: pointer;
            accent-color: #C9A961;
            flex-shrink: 0;
        }

        .checkbox-group label {
            font-size: 11px;
            color: #78716C;
            cursor: pointer;
            line-height: 1.5;
            text-align: left;
        }

        .dark .checkbox-group label { color: #A8A29E; }

        .checkbox-group a {
            color: #C9A961;
            text-decoration: none;
            font-weight: 700;
        }

        .checkbox-group a:hover { text-decoration: underline; }

        .btn-signup {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            border: none;
            border-radius: 40px;
            color: #0F1F3D;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-bottom: 10px;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            transition: background 0.25s, transform 0.08s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        .btn-signup::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            transition: left 0.6s ease;
        }

        .btn-signup:hover::before { left: 100%; }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(201, 169, 97, 0.6);
        }

        .btn-signup:active { transform: scale(0.98) translateY(0); }

        .divider {
            text-align: center;
            margin: clamp(12px, 2vh, 20px) 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #E8E2D6;
        }

        .dark .divider::before { background: #1E3A5F; }

        .divider span {
            position: relative;
            background: #ffffff;
            padding: 0 12px;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: #A8A29E;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .dark .divider span { background: #132339; color: #A8A29E; }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: clamp(10px, 1.5vh, 16px);
        }

        .social-btn {
            flex: 1;
            height: 44px;
            border-radius: 40px;
            border: 1px solid #E8E2D6;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #0F1F3D;
            transition: all 0.2s;
        }

        .dark .social-btn {
            background: rgba(255, 255, 255, 0.04);
            border-color: #1E3A5F;
            color: #F5EFE4;
        }

        .social-btn:hover {
            border-color: #C9A961;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -8px rgba(201, 169, 97, 0.45);
        }

        .social-btn i { 
            font-size: 14px; 
        }
        .social-btn.google i { color: #DB4437; }
        .social-btn.facebook i { color: #1877F2; }
        .social-btn.apple i { color: #0F1F3D; }
        .dark .social-btn.apple i { color: #F5EFE4; }

        .login-link {
            text-align: center;
            font-size: clamp(10px, 2vw, 12px);
            color: #78716C;
            padding-top: clamp(8px, 1vh, 12px);
            border-top: 1px solid #E8E2D6;
        }

        .dark .login-link {
            border-top-color: #1E3A5F;
            color: #A8A29E;
        }

        .login-link a {
            color: #C9A961;
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
        }

        .login-link a:hover { text-decoration: underline; }

        .top-controls {
            position: fixed;
            top: clamp(12px, 2vh, 18px);
            right: clamp(12px, 2vw, 18px);
            display: flex;
            gap: 10px;
            z-index: 200;
        }

        .control-btn {
            width: clamp(34px, 6vw, 42px);
            height: clamp(34px, 6vw, 42px);
            border-radius: 50%;
            background: rgba(15, 31, 61, 0.72);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 169, 97, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #E0C28A;
            font-size: clamp(13px, 3vw, 16px);
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(15, 31, 61, 0.25);
        }

        .control-btn:hover {
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            border-color: transparent;
            transform: scale(1.05);
            color: #0F1F3D;
        }

        .dark .control-btn {
            background: rgba(0, 0, 0, 0.65);
            border-color: rgba(201, 169, 97, 0.7);
            color: #E0C28A;
        }
        .dark .control-btn:hover {
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            color: #0F1F3D;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #C9A961, #E0C28A);
            color: #0F1F3D;
            padding: 11px 24px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 700;
            z-index: 300;
            animation: toastFade 2.5s ease forwards;
            white-space: nowrap;
            box-shadow: 0 10px 26px rgba(15, 31, 61, 0.35);
            pointer-events: none;
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            12% { opacity: 1; transform: translateX(-50%) translateY(0); }
            88% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-6px); visibility: hidden; }
        }

        /* RTL Support */
        [dir="rtl"] .top-controls { right: auto; left: clamp(12px, 2vw, 18px); }
        [dir="rtl"] .password-wrapper input { padding-right: 14px; padding-left: 44px; }
        [dir="rtl"] .toggle-password { right: auto; left: 12px; }
        [dir="rtl"] .checkbox-group { flex-direction: row-reverse; justify-content: flex-end; }
        [dir="rtl"] .checkbox-group label { text-align: right; }
        [dir="rtl"] .login-link a { margin-left: 0; margin-right: 5px; }
        [dir="rtl"] .social-login { flex-direction: row-reverse; }

        /* Responsive Breakpoints */
        @media (min-width: 1025px) {
            .signup-card {
                max-width: 520px;
                padding: 32px 40px;
            }
            .title h1 { font-size: 30px; }
            .form-group input { padding: 12px 14px; font-size: 13px; }
            .btn-signup { padding: 12px; font-size: 12px; }
        }

        @media (max-width: 1024px) {
            .signup-card { max-width: 480px; padding: 30px 30px; }
            .title h1 { font-size: 28px; }
        }

        @media (max-width: 768px) {
            .signup-card { max-width: 420px; padding: 26px 24px; border-radius: 28px; }
            .title h1 { font-size: 26px; }
            .social-btn { height: 42px; font-size: 12px; }
            .btn-signup { padding: 12px; }
        }

        @media (max-width: 480px) {
            .signup-card { max-width: 100%; padding: 24px 20px; border-radius: 24px; }
            .title h1 { font-size: 24px; }
            .social-btn { height: 40px; font-size: 11px; }
            .social-login { gap: 8px; }
            .btn-signup { padding: 11px; font-size: 11px; }
            .top-controls { top: 12px; right: 12px; }
            .control-btn { width: 38px; height: 38px; font-size: 14px; }
            [dir="rtl"] .top-controls { right: auto; left: 12px; }
            .checkbox-group label { font-size: 10px; }
        }

        @media (max-width: 320px) {
            .signup-card { padding: 16px 14px; border-radius: 20px; }
            .title h1 { font-size: 20px; }
            .title p { font-size: 11px; }
            .form-group label { font-size: 9px; }
            .form-group input { padding: 8px 10px; font-size: 11px; }
            .social-btn { height: 36px; font-size: 10px; flex-direction: column; justify-content: center; gap: 2px; }
            .social-btn i { font-size: 12px; }
            .social-login { gap: 6px; }
            .btn-signup { padding: 8px; font-size: 10px; margin-bottom: 8px; }
            .checkbox-group { gap: 6px; }
            .checkbox-group label { font-size: 9px; }
            .login-link { font-size: 10px; padding-top: 8px; }
        }

        @media (max-height: 850px) {
            .signup-card { padding: 20px 30px; }
            .logo { margin-bottom: 14px; }
            .title { margin-bottom: 12px; }
            .form-group { margin-bottom: 8px; }
            .social-login { margin-bottom: 12px; }
            .divider { margin: 12px 0; }
        }

        @media (max-height: 750px) {
            .signup-card { padding: 16px 24px; }
            .logo { margin-bottom: 10px; }
            .title { margin-bottom: 8px; }
            .title h1 { font-size: 22px; margin-bottom: 2px; }
            .title p { display: none; }
            .form-group { margin-bottom: 6px; }
            .form-group input { padding: 8px 12px; }
            .social-btn { height: 38px; }
            .social-login { margin-bottom: 8px; }
            .divider { margin: 10px 0; }
            .btn-signup { margin-bottom: 6px; padding: 10px; }
            .checkbox-group { margin: 6px 0; }
        }

        @media (max-height: 650px) {
            body { padding-top: 50px; padding-bottom: 10px; }
            .signup-card { padding: 12px 20px; border-radius: 20px; }
            .title h1 { font-size: 18px; }
            .form-group label { font-size: 9px; margin-bottom: 2px; }
            .form-group input { padding: 6px 10px; font-size: 11px; border-radius: 8px; }
            .social-btn { height: 34px; font-size: 10px; }
            .btn-signup { margin-bottom: 6px; padding: 8px; font-size: 10px; }
            .logo { margin-bottom: 8px; }
            .divider { margin: 8px 0; }
            .checkbox-group { margin: 4px 0; }
            .login-link { padding-top: 6px; }
        }
    </style>
</head>

<body>

    <div class="top-controls">
        <button class="control-btn" id="themeToggle" title="Toggle Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
        <button class="control-btn" id="rtlToggle" title="Toggle RTL Layout"><i class="fas fa-exchange-alt"></i></button>
    </div>

    <div class="signup-container dark">
        <div class="signup-card animate-fade-up">
            <!-- LOGO -->
            <div class="logo flex justify-center mb-6">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="logo-badge">
                        <i class="fas fa-building text-[#C9A961] text-lg"></i>
                    </div>
                    <div class="flex flex-col leading-none text-left">
                        <span class="font-display text-2xl font-bold text-white">Estate<span style="color:#C9A961;">Hub</span></span>
                        <span class="text-[8px] tracking-[0.28em] uppercase font-semibold text-white/60">Real Estate • Property Portal</span>
                    </div>
                </a>
            </div>
            
            <div class="title">
                <h1>Create <span class="gold-italic">Account</span></h1>
                <p>Join EstateHub — buy, rent, or sell with trusted agents</p>
            </div>

            <div class="social-login">
                <button class="social-btn google" id="googleSignup"><i class="fab fa-google"></i><span>Google</span></button>
                <button class="social-btn facebook" id="facebookSignup"><i class="fab fa-facebook-f"></i><span>Facebook</span></button>
                <button class="social-btn apple" id="appleSignup"><i class="fab fa-apple"></i><span>Apple</span></button>
            </div>

            <div class="divider"><span>Or sign up with email</span></div>

            <form id="signupForm" novalidate>
                <div class="flex flex-col">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullname" placeholder="John Smith" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="hello@estatehub.com" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Create password" autocomplete="new-password" required>
                            <button type="button" class="toggle-password" data-target="password"><i class="fas fa-eye-slash"></i></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" required>
                            <button type="button" class="toggle-password" data-target="confirmPassword"><i class="fas fa-eye-slash"></i></button>
                        </div>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletterCheckbox" checked>
                    <label for="newsletterCheckbox">Send me property tips, market updates, and exclusive listings</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="termsCheckbox" required>
                    <label for="termsCheckbox">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="btn-signup">Create Account →</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script>
        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast && toast.parentNode) toast.remove(); }, 2600);
        }

        // Password visibility toggle
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const input = document.getElementById(btn.getAttribute('data-target'));
                const icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye-slash';
                }
            });
        });

        // Dark Mode
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        function updateThemeIcon() {
            if (html.classList.contains('dark')) {
                themeIcon.className = 'fas fa-sun';
            } else {
                themeIcon.className = 'fas fa-moon';
            }
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
                updateThemeIcon();
            });
        }

        if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');
        updateThemeIcon();

        // RTL Toggle
        const rtlToggle = document.getElementById('rtlToggle');
        if (rtlToggle) {
            rtlToggle.addEventListener('click', () => {
                if (document.documentElement.getAttribute('dir') === 'rtl') {
                    document.documentElement.removeAttribute('dir');
                    localStorage.setItem('dir', 'ltr');
                    
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                    localStorage.setItem('dir', 'rtl');
                    
                }
            });
        }
        if (localStorage.getItem('dir') === 'rtl') document.documentElement.setAttribute('dir', 'rtl');

        // Social signup handlers
        const socialHandlers = { google: 'Google', facebook: 'Facebook', apple: 'Apple' };
        Object.keys(socialHandlers).forEach(provider => {
            const btn = document.getElementById(`${provider}Signup`);
            if (btn) {
                btn.addEventListener('click', () => showToast(` ${socialHandlers[provider]} sign-up — coming soon`));
            }
        });

        // Form validation
        const signupForm = document.getElementById('signupForm');
        if (signupForm) {
            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const fullname = document.getElementById('fullname').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirm = document.getElementById('confirmPassword').value;
                const termsChecked = document.getElementById('termsCheckbox').checked;

                if (!fullname || fullname.length < 2) {
                    showToast(' Please enter your full name');
                    return;
                }
                const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    showToast(' Please enter a valid email address');
                    return;
                }
                if (!password || password.length < 6) {
                    showToast(' Password must be at least 6 characters');
                    return;
                }
                if (password !== confirm) {
                    showToast(' Passwords do not match');
                    return;
                }
                if (!termsChecked) {
                    showToast(' Please agree to the Terms of Service');
                    return;
                }

                const firstName = fullname.split(' ')[0] || "Member";
                showToast(` Welcome ${firstName}! Your EstateHub account is ready.`);
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            });
        }
    </script>
</body>

</html>
